<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Racing | 404</title>
<link href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="Favicon.png"/>
<style>
:root {
    --principal: #212643;
    --secundario: #66221d;
    --bg-deep: #0a0a0a;
    --bg-alt: #0f0f0f;
    --surface: #141414;
    --b-blue: rgba(33,38,67,0.95);
    --b-red: rgba(102,34,29,0.40);
    --blanco: #ffffff;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Carter One', cursive; 
}

body { 
    background: var(--bg-deep); 
    color: var(--blanco); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    padding: 20px; 
    position: relative;
    overflow: hidden;
}

/* ==============================
   FONDO CON PARTÍCULAS
============================== */
#particles-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

/* ==============================
   ANILLOS ORBITANTES
============================== */
.track-container {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.04;
    pointer-events: none;
}

.track-ring {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: orbit 30s linear infinite;
}

.track-ring:nth-child(1) {
    width: 280px;
    height: 280px;
    top: 12%;
    left: 6%;
    animation-duration: 28s;
    animation-direction: reverse;
}

.track-ring:nth-child(2) {
    width: 480px;
    height: 480px;
    bottom: 8%;
    right: 4%;
    animation-duration: 38s;
}

.track-ring:nth-child(3) {
    width: 680px;
    height: 680px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation-duration: 48s;
    animation-direction: reverse;
    opacity: 0.6;
}

@keyframes orbit {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* ==============================
   CONTENEDOR PRINCIPAL (SIN BORDES REDONDEADOS)
============================== */
.data-box {
    background: rgba(20, 20, 20, 0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--b-blue);
    padding: 45px 45px 45px;
    border-radius: 0;
    max-width: 620px;
    width: 100%;
    position: relative;
    z-index: 1;
    box-shadow: 
        0 0 80px rgba(33,38,67,0.12),
        inset 0 0 80px rgba(33,38,67,0.04);
    animation: floatIn 0.8s var(--ease) both;
}

@keyframes floatIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ==============================
   ESQUINAS DECORATIVAS (bordes rectos)
============================== */
.corner {
    position: absolute;
    width: 28px;
    height: 28px;
    opacity: 0.5;
    transition: opacity 0.5s var(--ease);
    pointer-events: none;
}

.data-box:hover .corner {
    opacity: 0.9;
}

/* ESQUINA SUPERIOR IZQUIERDA */
.corner-tl { 
    top: -1px; 
    left: -1px; 
}
.corner-tl::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 28px;
    height: 2px;
    background: var(--secundario);
}
.corner-tl::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 2px;
    height: 28px;
    background: var(--secundario);
}

/* ESQUINA SUPERIOR DERECHA */
.corner-tr { 
    top: -1px; 
    right: -1px; 
}
.corner-tr::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 28px;
    height: 2px;
    background: var(--secundario);
}
.corner-tr::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 2px;
    height: 28px;
    background: var(--secundario);
}

/* ESQUINA INFERIOR IZQUIERDA */
.corner-bl { 
    bottom: -1px; 
    left: -1px; 
}
.corner-bl::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 28px;
    height: 2px;
    background: var(--secundario);
}
.corner-bl::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 2px;
    height: 28px;
    background: var(--secundario);
}

/* ESQUINA INFERIOR DERECHA */
.corner-br { 
    bottom: -1px; 
    right: -1px; 
}
.corner-br::before {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 28px;
    height: 2px;
    background: var(--secundario);
}
.corner-br::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 2px;
    height: 28px;
    background: var(--secundario);
}

/* ==============================
   LOGO + 404 (misma línea)
============================== */
.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    position: relative;
    width: 100%;
}

.error-code-wrap {
    position: relative;
    display: inline-block;
}

.error-code {
    font-size: 7.5rem;
    line-height: 1;
    font-weight: normal;
    color: var(--blanco);
    position: relative;
    z-index: 1;
    letter-spacing: 2px;
}

.error-code::before,
.error-code::after {
    content: '404';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
}

.error-code::before {
    color: var(--principal);
    z-index: -1;
    animation: glitchShift 5s infinite;
    transform: translate(-2px, -1px);
}

.error-code::after {
    color: rgba(102,34,29,0.3);
    z-index: -2;
    animation: glitchShift 5s infinite reverse;
    transform: translate(2px, 1px);
}

@keyframes glitchShift {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 1; transform: translate(-3px, -2px); }
    94% { opacity: 0; }
    95% { opacity: 1; transform: translate(3px, 2px); }
    96% { opacity: 0; }
}

.logo-container {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
}

.logo-container img {
    height: 100px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(33,38,67,0.25));
    transition: all 0.4s var(--ease);
}

.logo-container img:hover {
    filter: drop-shadow(0 0 50px rgba(102,34,29,0.2));
    transform: scale(1.04);
}

/* ==============================
   TÍTULO Y DESCRIPCIÓN
============================== */
h2 {
    font-size: 1.8rem;
    text-transform: uppercase;
    margin: 18px 0 6px;
    letter-spacing: 4px;
    color: var(--blanco);
    text-align: left;
}

.sub-error {
    font-size: 0.85rem;
    opacity: 0.4;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 28px;
    text-align: left;
}

p {
    opacity: 0.6;
    margin-bottom: 38px;
    line-height: 1.8;
    font-size: 0.95rem;
    max-width: 460px;
    text-align: left;
}

/* ==============================
   BARRA DE TELEMETRÍA
============================== */
.telemetry-container {
    width: 100%;
    margin-bottom: 38px;
    position: relative;
}

.telemetry-bar {
    height: 2px;
    width: 100%;
    background: rgba(255,255,255,0.05);
    border-radius: 0;
    position: relative;
    overflow: hidden;
}

.telemetry-bar::after {
    content: '';
    position: absolute;
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, var(--principal), var(--secundario));
    border-radius: 0;
    animation: telemetryScan 2.8s ease-in-out infinite;
}

@keyframes telemetryScan {
    0% { left: -35%; }
    50% { left: 100%; }
    100% { left: 100%; }
}

.telemetry-dots {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    padding: 0 2px;
}

.telemetry-dots span {
    width: 3px;
    height: 3px;
    border-radius: 0;
    background: rgba(255,255,255,0.08);
    transition: background 0.4s var(--ease);
}

.telemetry-dots span.active {
    background: var(--secundario);
}

/* ==============================
   BOTÓN AZUL (sin flecha)
============================== */
.btn-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 38px;
    background: var(--principal);
    border: 1px solid var(--b-blue);
    color: var(--blanco);
    text-decoration: none;
    text-transform: uppercase;
    border-radius: 0;
    font-size: 0.8rem;
    letter-spacing: 3px;
    transition: all 0.4s var(--ease);
    position: relative;
    box-shadow: 0 4px 20px rgba(33,38,67,0.3);
}

.btn-back:hover {
    background: var(--b-blue);
    border-color: var(--secundario);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(33,38,67,0.4);
}

.btn-back:active {
    transform: translateY(0px) scale(0.98);
    box-shadow: 0 2px 10px rgba(33,38,67,0.2);
}

/* ==============================
   RESPONSIVE
============================== */
@media (max-width: 600px) {
    .data-box {
        padding: 30px 25px 30px;
        margin: 10px;
    }
    
    .header-row {
        gap: 15px;
    }
    
    .logo-container img {
        height: 70px;
    }
    
    .error-code {
        font-size: 5.5rem;
    }
    
    h2 {
        font-size: 1.4rem;
        letter-spacing: 3px;
    }
    
    .sub-error {
        font-size: 0.7rem;
        letter-spacing: 5px;
    }
    
    p {
        font-size: 0.85rem;
        line-height: 1.7;
    }
    
    .btn-back {
        padding: 14px 28px;
        font-size: 0.7rem;
        letter-spacing: 2px;
        width: 100%;
        justify-content: center;
    }
    
    .corner {
        width: 20px;
        height: 20px;
    }
    
    .corner-tl::before,
    .corner-tr::before,
    .corner-bl::before,
    .corner-br::before {
        width: 20px;
        height: 1.5px;
    }
    
    .corner-tl::after,
    .corner-tr::after,
    .corner-bl::after,
    .corner-br::after {
        width: 1.5px;
        height: 20px;
    }
    
    .track-ring:nth-child(1) { width: 140px; height: 140px; }
    .track-ring:nth-child(2) { width: 220px; height: 220px; }
    .track-ring:nth-child(3) { width: 300px; height: 300px; }
}

@media (max-width: 400px) {
    .header-row {
        gap: 10px;
    }
    
    .logo-container img {
        height: 55px;
    }
    
    .error-code {
        font-size: 4rem;
    }
    
    h2 {
        font-size: 1.1rem;
    }
    
    .data-box {
        padding: 25px 18px 22px;
    }
    
    .corner {
        width: 16px;
        height: 16px;
    }
    
    .corner-tl::before,
    .corner-tr::before,
    .corner-bl::before,
    .corner-br::before {
        width: 16px;
        height: 1.5px;
    }
    
    .corner-tl::after,
    .corner-tr::after,
    .corner-bl::after,
    .corner-br::after {
        width: 1.5px;
        height: 16px;
    }
}

/* ==============================
   REDUCED MOTION
============================== */
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* ==============================
   SELECCIÓN DE TEXTO
============================== */
::selection {
    background: var(--secundario);
    color: var(--blanco);
}
</style>
</head>
<body>

<!-- ==============================
   CANVAS DE PARTÍCULAS
============================== -->
<canvas id="particles-canvas"></canvas>

<!-- ==============================
   ANILLOS DE FONDO
============================== -->
<div class="track-container" aria-hidden="true">
    <div class="track-ring"></div>
    <div class="track-ring"></div>
    <div class="track-ring"></div>
</div>

<!-- ==============================
   CONTENIDO PRINCIPAL
============================== -->
<div class="data-box">
    
    <!-- Esquinas decorativas -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Fila: 404 + Logo -->
    <div class="header-row">
        <div class="error-code-wrap">
            <div class="error-code">404</div>
        </div>
        <div class="logo-container">
            <img src="Logonegativo.png" alt="Logo Astra Racing">
        </div>
    </div>

    <h2>Error de telemetría</h2>
    <p class="sub-error">Señal perdida</p>

    <!-- Barra de telemetría -->
    <div class="telemetry-container">
        <div class="telemetry-bar"></div>
        <div class="telemetry-dots" id="telemetryDots">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </div>

    <p>
        Bandera roja. La página que buscas no ha podido completar la vuelta. 
        Regresa al box e inténtalo de nuevo.
    </p>

    <a href="index.html" class="btn-back">
        Volver al garaje
    </a>

</div>

<script>
/* ==============================
   PARTÍCULAS
============================== */
(function() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animFrame;
    let width, height;

    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }

    function createParticles() {
        particles = [];
        const count = Math.floor((width * height) / 28000);
        for (let i = 0; i < Math.min(count, 80); i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.6 + 0.3,
                alpha: Math.random() * 0.35 + 0.03,
                dx: (Math.random() - 0.5) * 0.2,
                dy: (Math.random() - 0.5) * 0.2,
                pulse: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.015 + 0.005
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        const t = Date.now() / 1000;

        particles.forEach(p => {
            p.x += p.dx;
            p.y += p.dy;
            
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            const alpha = p.alpha * (0.6 + 0.4 * Math.sin(t * p.speed * 2 + p.pulse));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(168,180,240,${alpha})`;
            ctx.fill();
        });

        if (particles.length < 50) {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const alpha = (1 - dist / 100) * 0.06;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(168,180,240,${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        animFrame = requestAnimationFrame(draw);
    }

    resize();
    createParticles();
    draw();

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            resize();
            createParticles();
        }, 200);
    });

    window.addEventListener('beforeunload', () => {
        if (animFrame) cancelAnimationFrame(animFrame);
    });
})();

/* ==============================
   PUNTOS DE TELEMETRÍA
============================== */
(function() {
    const dots = document.querySelectorAll('#telemetryDots span');
    let index = 0;

    function updateDots() {
        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === index);
        });
        index = (index + 1) % dots.length;
    }

    updateDots();
    setInterval(updateDots, 250);
})();

/* ==============================
   PARALLAX SUTIL
============================== */
(function() {
    const box = document.querySelector('.data-box');
    let isMobile = window.innerWidth < 768;
    let xOffset = 0;
    let yOffset = 0;

    window.addEventListener('resize', () => {
        isMobile = window.innerWidth < 768;
    });

    document.addEventListener('mousemove', (e) => {
        if (isMobile) return;
        
        const x = (e.clientX / window.innerWidth - 0.5) * 3;
        const y = (e.clientY / window.innerHeight - 0.5) * 3;
        
        xOffset += (x - xOffset) * 0.06;
        yOffset += (y - yOffset) * 0.06;
        
        box.style.transform = `perspective(600px) rotateY(${xOffset * 0.2}deg) rotateX(${-yOffset * 0.2}deg)`;
    });

    document.addEventListener('mouseleave', () => {
        if (!isMobile) {
            box.style.transform = 'perspective(600px) rotateY(0deg) rotateX(0deg)';
        }
    });
})();
</script>

</body>
</html>
